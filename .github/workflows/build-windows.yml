name: Build Windows and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build CLI
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name BiliTV-Downloader bilitv_downloader.py
      - name: Build GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BiliTV-Downloader-GUI bilitv_gui.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliTV-Downloader-Windows
          path: |
            dist/BiliTV-Downloader.exe
            dist/BiliTV-Downloader-GUI.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG_NAME" --title "$env:TAG_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload "$env:TAG_NAME" dist/BiliTV-Downloader.exe dist/BiliTV-Downloader-GUI.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
